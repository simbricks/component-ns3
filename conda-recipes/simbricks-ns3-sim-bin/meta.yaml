package:
  name: simbricks-ns3-sim-bin
  version: {{ simbricks_version }}

source:
  # Build from the repo root, which holds the top-level Makefile and the ns-3/
  # submodule with the ns-3 sources.
  path: ../../

build:
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - cmake
    - ninja
    - pkg-config

  host:
    - simbricks-lib >=0.4.2
    - libsqlite
    - python

  run:
    - simbricks-ns3-sim-py =={{ simbricks_version }}

about:
  home: {{ homepage }}
  license: GPL-2.0
  license_family: GPL2
  license_file:
    - ns-3/LICENSE
  summary: SimBricks-adapted ns-3 simulator for full-system network simulation.
  dev_url: {{ github_org }}
